<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Przyroda, klasa 4: Moja okolica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCF7; --grid:#D9EBD7; --card:#FFFFFF; --text:#1C2333; --muted:#55607A;
  --ink:#1D3A8F; --line:#B9C3DA;
  --pink:rgba(255,79,176,.42); --orange:rgba(255,122,61,.45); --cyan:rgba(44,197,218,.45);
  --good:#0B7A54; --bad:#C8321A; --pen:#D62828;
  --hand:'Caveat', 'Comic Sans MS', cursive;
  --body:'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A2C; --grid:#1B2840; --card:#172238; --text:#E8EDF7; --muted:#A3AFC8;
    --ink:#A9BEFF; --line:#34446A;
    --pink:rgba(255,79,176,.38); --orange:rgba(255,122,61,.38); --cyan:rgba(44,197,218,.35);
    --good:#4FD9A3; --bad:#FF7A61; --pen:#FF6B6B;
  }
}
:root[data-theme="dark"]{
  --paper:#111A2C; --grid:#1B2840; --card:#172238; --text:#E8EDF7; --muted:#A3AFC8;
  --ink:#A9BEFF; --line:#34446A;
  --pink:rgba(255,79,176,.38); --orange:rgba(255,122,61,.38); --cyan:rgba(44,197,218,.35);
  --good:#4FD9A3; --bad:#FF7A61; --pen:#FF6B6B;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;font-family:var(--body);color:var(--text);font-size:17px;line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.app{max-width:900px;margin:0 auto;padding:20px 16px 60px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:var(--hand);font-weight:700;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1;margin:0;color:var(--ink)}
h1 span{background:linear-gradient(transparent 38%,var(--orange) 38% 88%,transparent 88%);padding:0 .15em}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
nav{display:flex;gap:6px}
nav button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500}
nav button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* ---------- NAUKA ---------- */
.learn{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.toc{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.toc button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text);font-size:.95rem}
.toc button .n{display:inline-block;width:1.6em;color:var(--muted);font-variant-numeric:tabular-nums}
.toc button[aria-current="true"]{background:var(--card);box-shadow:inset 3px 0 0 var(--ink);font-weight:600}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 4px;padding:22px 24px 26px;box-shadow:inset 34px 0 0 -32px var(--pen)}
.sheet h2{font-family:var(--hand);font-size:2.3rem;line-height:1.1;margin:0 0 14px;color:var(--ink);font-weight:700}
.sheet h3{font-family:var(--hand);font-size:1.7rem;margin:22px 0 6px;font-weight:700;color:var(--text)}
.hl-o{background:linear-gradient(transparent 40%,var(--orange) 40% 90%,transparent 90%)}
.hl-p{background:linear-gradient(transparent 40%,var(--pink) 40% 90%,transparent 90%)}
.hl-c{background:linear-gradient(transparent 40%,var(--cyan) 40% 90%,transparent 90%)}
.sheet p{margin:6px 0;max-width:68ch}
.sheet ul,.sheet ol{margin:6px 0;padding-left:1.3em;max-width:68ch}
.sheet li{margin:3px 0}
.def{border-left:4px solid var(--ink);padding:6px 0 6px 14px;margin:10px 0;font-weight:500}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px}
.formula{font-family:var(--hand);font-size:1.6rem;line-height:1.3;margin:10px 0;color:var(--ink)}
.sheet-actions{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
.compass-learn{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.compass-learn svg{width:min(300px,100%);height:auto}
.compass-say{font-family:var(--hand);font-size:2rem;color:var(--ink);min-width:12ch}

/* ---------- BUTTONS ---------- */
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- TEST SETUP ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.panel h2{font-family:var(--hand);font-size:2.2rem;margin:0 0 6px;color:var(--ink)}
.field{margin:18px 0}
.field > .lbl{font-weight:600;margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.93rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--pink)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
details{margin-top:18px}
summary{cursor:pointer;color:var(--muted)}
.scale{border-collapse:collapse;margin-top:10px;font-size:.95rem}
.scale td{padding:4px 10px 4px 0}
.scale input{width:4.2em;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.history{margin-top:22px;font-size:.93rem;color:var(--muted)}
.history ol{padding-left:1.2em;margin:6px 0}

/* ---------- QUIZ ---------- */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.qtext{font-size:1.25rem;font-weight:500;margin:4px 0 4px;max-width:60ch}
.qhint{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;width:100%}
.opt .box{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.round .box{border-radius:50%}
.opt.sel{border-color:var(--ink);background:var(--pink)}
.opt.sel .box{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt.ok{border-color:var(--good);background:var(--cyan)}
.opt.no{border-color:var(--bad);background:var(--orange)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.order li{list-style:none;display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
.order{padding:0;margin:0}
.order .pos{font-family:var(--hand);font-size:1.6rem;width:1.2em;text-align:center;color:var(--ink)}
.order .txt{flex:1}
.order .mv{display:flex;gap:4px}
.order .mv button{border:1px solid var(--line);background:transparent;border-radius:6px;width:36px;height:36px;cursor:pointer}
.order li.ok{border-color:var(--good);background:var(--cyan)}
.order li.no{border-color:var(--bad);background:var(--orange)}
.num{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num input{width:8em;padding:10px 12px;font-size:1.3rem;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.num input.ok{border-color:var(--good);background:var(--cyan)}
.num input.no{border-color:var(--bad);background:var(--orange)}
.compass-q svg{width:min(340px,100%);height:auto;display:block;margin:0 auto}
.cdir{cursor:pointer}
.cdir circle{fill:var(--card);stroke:var(--line);stroke-width:2}
.cdir text{font-family:var(--body);font-weight:600;font-size:15px;fill:var(--text);pointer-events:none}
.cdir:hover circle,.cdir:focus circle{stroke:var(--ink)}
.cdir:focus{outline:none}
.cdir.sel circle{fill:var(--pink);stroke:var(--ink);stroke-width:3}
.cdir.ok circle{fill:var(--cyan);stroke:var(--good);stroke-width:3}
.cdir.no circle{fill:var(--orange);stroke:var(--bad);stroke-width:3}
.feedback{margin-top:16px;padding:12px 14px;border-radius:10px;border:2px solid}
.feedback.ok{border-color:var(--good)}
.feedback.half{border-color:var(--ink)}
.feedback.no{border-color:var(--bad)}
.feedback b{display:block;margin-bottom:2px}
.qactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ---------- RESULTS ---------- */
.result-top{display:flex;flex-wrap:wrap;align-items:center;gap:20px 30px}
.grade{position:relative;width:150px;height:150px;flex:none}
.grade svg{position:absolute;inset:0;width:100%;height:100%}
.grade .digit{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hand);font-weight:700;font-size:6rem;line-height:1;color:var(--pen)}
.grade path{fill:none;stroke:var(--pen);stroke-width:4;stroke-linecap:round;stroke-dasharray:620;stroke-dashoffset:620;animation:draw 1s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gname{font-family:var(--hand);font-size:2.4rem;line-height:1;color:var(--ink);margin:0}
.gsum{margin:6px 0 0;font-size:1.1rem}
.gmsg{color:var(--muted);margin:4px 0 0}
.review{margin-top:26px;padding:0;list-style:none}
.review li{border-top:1px solid var(--line);padding:14px 0}
.review .mark{font-weight:700;margin-right:6px}
.review .mark.ok{color:var(--good)}.review .mark.no{color:var(--bad)}.review .mark.half{color:var(--ink)}
.review .row{font-size:.95rem;margin:3px 0 0}
.review .why{color:var(--muted);font-size:.92rem;margin-top:4px}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* sort + tree */
.sort{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.sort li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.sort li.ok{border-color:var(--good)}.sort li.no{border-color:var(--bad)}
.sort .txt{font-weight:500}
.sort .cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:2px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.cat.sel{border-color:var(--ink);background:var(--pink)}
.cat.ok{border-color:var(--good);background:var(--cyan)}
.cat.no{border-color:var(--bad);background:var(--orange)}
.cat:disabled{cursor:default}
svg.tree{width:100%;max-width:560px;height:auto;display:block;margin:6px auto}
svg.tree .tn{font-family:var(--body);font-weight:600;font-size:15px;fill:var(--text)}
svg.tree .tr{font-family:var(--body);font-size:11.5px;fill:var(--muted)}
.tree-learn .tp{cursor:pointer}
.tree-learn .tp:focus{outline:none}
.tree-learn .tp:focus rect{stroke-width:3}
.tree-q{margin-bottom:12px}
@media (max-width:720px){
  .learn{grid-template-columns:1fr}
  .toc{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .toc button{white-space:nowrap}
  .sheet{padding:18px 16px 22px}
  .panel{padding:18px 16px}
  .tf{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .grade path{animation:none;stroke-dashoffset:0}
  .progress i{transition:none}
}

/* ---------- PRZYRODA: MOJA OKOLICA ---------- */
.learn>*{min-width:0}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.day{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dn{font-family:var(--hand);font-size:1.9rem;line-height:1;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.day .done{font-family:var(--hand);font-size:1.9rem;color:var(--pen);border:2px solid var(--pen);border-radius:50%;width:1.3em;height:1.3em;display:inline-grid;place-items:center;line-height:1}
.day .what{font-size:.95rem}
.day .row{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
.tl{font-size:.88rem;color:var(--muted)}
.btn.small{padding:7px 14px;font-size:.93rem}
.muted{color:var(--muted)}
.weak{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:8px}
.weak li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.src{margin:0 0 4px!important;font-size:.85rem;color:var(--muted)}
.trap{border:2px dashed var(--pen);border-radius:10px;padding:8px 12px;margin:12px 0!important}
.say{font-family:var(--hand);font-size:1.7rem;color:var(--ink);min-height:1.4em;margin:4px 0 8px!important}
.tbl{border-collapse:collapse;width:100%;margin:10px 0;font-size:.93rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl thead th{background:var(--grid)}
.tbl-wrap{overflow-x:auto}
ol.stages{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;counter-reset:st;max-width:none!important}
ol.stages li{counter-increment:st;border:2px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;margin:0!important}
ol.stages li::before{content:counter(st);font-family:var(--hand);font-size:1.8rem;color:var(--pen);line-height:1;display:block}
ol.stages li span{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
svg.dia{width:100%;max-width:620px;height:auto;display:block}
.hot-q svg.dia,.dia-learn svg.dia{margin:8px auto}
.hz{cursor:pointer}
.hz circle{fill:var(--card);stroke:var(--ink);stroke-width:3}
.hz:hover circle,.hz:focus circle{fill:var(--cyan)}
.hz:focus{outline:none}
.hz.sel circle{fill:var(--ink)}
.hz.sel .hzq{fill:var(--paper)}
.hz.ok circle{fill:var(--good);stroke:var(--good)}
.hz.no circle{fill:var(--bad);stroke:var(--bad)}
.hz.soil rect{stroke:transparent;stroke-width:5}
.hz.soil:hover rect,.hz.soil:focus rect{stroke:var(--cyan)}
.hz.soil.sel rect{stroke:var(--ink)}
.hz.soil.ok rect{stroke:var(--good)}
.hz.soil.no rect{stroke:var(--bad)}
.hzq{font:700 18px var(--body);fill:var(--ink);text-anchor:middle;pointer-events:none}
.hzq.light{fill:#fff;font-size:24px}
.hzl{font:600 19px var(--body);fill:var(--text)}
.hzs{font:italic 16px var(--body);fill:var(--muted)}
.qlabel{margin:0 0 8px;font-size:.9rem;color:var(--muted);font-weight:600}
.per{list-style:none;padding:0;margin:14px 0;display:grid;gap:6px}
.per li{display:grid;grid-template-columns:minmax(0,1fr) 120px 3.5em;gap:10px;align-items:center;font-size:.92rem}
.per .bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.per .bar i{display:block;height:100%;background:var(--ink)}
@media (max-width:720px){.per li{grid-template-columns:minmax(0,1fr) 70px 3.2em}.hzl{font-size:26px}.hz circle{r:24px}.hzq{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1><span>Przyroda: Moja okolica</span></h1>
      <p class="sub">Klasa 4, dział II (podręcznik s. 54–90) – 7 dni przygotowań do sprawdzianu</p>
    </div>
    <nav>
      <button id="tab-plan" aria-current="true">Plan</button>
      <button id="tab-learn" aria-current="false">Nauka</button>
      <button id="tab-test" aria-current="false">Test</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
/* ================= POMOCNICZE ================= */
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function R(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(n){return String(Math.round(n*10)/10).replace('.',',')}
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ================= RYSUNKI ================= */
const TER_Z={szczyt:{x:190,y:62,n:'szczyt',lx:190,ly:30,a:'middle'},stok:{x:124,y:142,n:'stok',lx:96,ly:132,a:'end'},podnoze:{x:62,y:220,n:'podnóże',lx:62,ly:252,a:'middle'},
  zbocze:{x:468,y:206,n:'zbocze doliny',lx:500,ly:166,a:'start'},dno:{x:404,y:234,n:'dno doliny',lx:404,ly:276,a:'middle'}};
function terrainSVG({labels=true,states={}}={}){
  let s=`<svg class="dia" viewBox="0 0 640 288" role="group" aria-label="Przekrój terenu: wzniesienie i dolina">`;
  s+=`<polygon points="0,220 62,220 190,62 322,200 380,234 430,234 500,180 640,180 640,288 0,288" fill="#8DBF6A" stroke="#4E7A33" stroke-width="2.5"/>`;
  s+=`<polygon points="160,98 190,62 222,102 205,96 190,108 175,96" fill="#F4F4F2" opacity=".9"/>`;
  s+=`<path d="M384,236 Q405,229 426,236" stroke="#3B8BD4" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  Object.entries(TER_Z).forEach(([k,z],i)=>{const st=states[k]||'';
    s+=`<g class="hz ${st}" data-k="${k}" tabindex="0" role="button" aria-label="${labels?z.n:'miejsce '+(i+1)}"><circle cx="${z.x}" cy="${z.y}" r="15"/>`;
    s+=`<text class="hzq" x="${z.x}" y="${z.y+5}">${labels?'':'?'}</text></g>`;
    if(labels)s+=`<text class="hzl" x="${z.lx}" y="${z.ly}" text-anchor="${z.a}">${z.n}</text>`});
  if(labels)s+=`<text class="hzs" x="190" y="200" text-anchor="middle">wzniesienie</text><text class="hzs" x="560" y="210" text-anchor="middle">równina</text>`;
  return s+'</svg>';
}
const SOIL_Z={prochniczny:{y:62,h:78,n:'poziom próchniczny',fill:'#3A2A1E'},glebsze:{y:140,h:110,n:'głębsze poziomy glebowe',fill:'#A3622F'},skala:{y:250,h:70,n:'skała',fill:'#A9A69C'}};
function soilSVG({labels=true,states={}}={}){
  let s=`<svg class="dia" viewBox="0 0 640 330" role="group" aria-label="Przekrój gleby">`;
  s+=`<rect x="110" y="44" width="230" height="18" fill="#6BAA3F"/>`;
  for(let i=0;i<20;i++){const x=114+i*11.5;s+=`<path d="M${x},44 l3,-14 l3,14" fill="#5C9A33"/>`}
  Object.entries(SOIL_Z).forEach(([k,z],i)=>{const st=states[k]||'';
    s+=`<g class="hz soil ${st}" data-k="${k}" tabindex="0" role="button" aria-label="${labels?z.n:'warstwa '+(i+1)}"><rect x="110" y="${z.y}" width="230" height="${z.h}" fill="${z.fill}"/>`;
    if(!labels)s+=`<text class="hzq light" x="225" y="${z.y+z.h/2+6}">?</text>`;
    s+=`</g>`;
    if(labels)s+=`<line x1="346" y1="${z.y+z.h/2}" x2="366" y2="${z.y+z.h/2}" stroke="var(--muted)" stroke-width="1.5"/><text class="hzl" x="372" y="${z.y+z.h/2+5}" text-anchor="start">${z.n}</text>`});
  [[135,272],[182,290],[250,268],[305,300],[160,305],[220,296]].forEach(([x,y])=>s+=`<ellipse cx="${x}" cy="${y}" rx="11" ry="7" fill="#8C897F" pointer-events="none"/>`);

skaly:`
 <h2>Rozpoznaję skały</h2>
 <div class="def"><b>Skała</b> to naturalny materiał budujący powierzchnię Ziemi. Skały tworzą <b>minerały</b> (jak składniki ciasta). Skały pokrywają lądy i tworzą dno mórz i oceanów.</div>
 <p class="trap"><b>Pułapka!</b> Beton, pustaki i cegły <u>nie są</u> skałami – zrobił je człowiek. Za to piasek na plaży <u>jest</u> skałą.</p>
 <h3><span class="hl-o">Cztery cechy skał i jak je zbadać</span></h3>
 <ul>
  <li><b>barwa</b> – oglądamy (np. przez lupę),</li>
  <li><b>spójność</b> – naciskamy palcami lub lekko pukamy małym młotkiem,</li>
  <li><b>twardość</b> – próbujemy zarysować gwoździem,</li>
  <li><b>odporność na działanie wody</b> – zanurzamy w wodzie.</li>
 </ul>

  <tr><th>luźne (sypkie)</th><td>osobne, niepołączone ziarna; nawet mokra nie da trwałej kulki</td><td><b>piasek</b> – jasny, przesypuje się; <b>żwir</b> – ziarna większe od piasku, różne kolory</td></tr>
  <tr><th>zwięzłe</th><td>suche – twarde, ale da się pokruszyć w dłoni; wilgotne – plastyczne; woda je rozmywa</td><td><b>less</b> – żółtawy, jasnobrunatny, miękki; <b>glina</b> – brązowa, mokrą można lepić</td></tr>
  <tr><th>lite</th><td>minerały mocno połączone – nie rozkruszysz w dłoni, woda ich nie rozmiękczy</td><td><b>węgiel</b> – czarny z połyskiem, kruchy; <b>piaskowiec</b> – sklejone ziarna piasku, żółty, czerwony lub szary; <b>wapień</b> – jasny, pieni się z octem; <b>granit</b> – bardzo twardy, szary lub różowawy, widać ziarna minerałów</td></tr>

 </ul>`,
gleba:`
 <h2>Co kryje gleba?</h2>
 <div class="def"><b>Gleba</b> to naturalna warstwa przykrywająca skały na powierzchni Ziemi. Jest podłożem, z którego wyrastają rośliny.</div>
 <h3><span class="hl-o">Jak powstaje gleba</span></h3>
 <p>Bardzo <b>wolno</b> – przez setki, a nawet tysiące lat – <b>ze skał i z udziałem organizmów</b>.</p>
 <ol class="stages">
  <li><b>Okruchy skał</b><span>skały pękają i rozpadają się</span></li>
  <li><b>Pierwsze organizmy</b><span>bakterie, mchy i grzyby kruszą skały jeszcze bardziej</span></li>
  <li><b>Próchnica glebowa</b><span>powstaje ze szczątków obumarłych organizmów</span></li>
  <li><b>Ukształtowana gleba</b><span>zasiedlają ją coraz większe rośliny i zwierzęta</span></li>
 </ol>
 <h3><span class="hl-c">Składniki gleby</span></h3>
 <div class="cols">
  <div><b>ożywione</b><ul><li>korzenie roślin</li><li>bakterie</li><li>grzyby (grzybnia wygląda jak <b>białe nitki</b>)</li><li>zwierzęta: dżdżownice, mrówki, krety – ich ślady to <b>kanaliki i korytarze</b></li></ul></div>
  <div><b>nieożywione</b><ul><li><b>próchnica glebowa</b> – ciemnobrązowa lub ciemnoszara</li><li>okruchy skał</li><li>woda</li><li>powietrze (między bryłkami)</li></ul></div>
 </div>
 <p class="trap"><b>Pułapka!</b> Próchnica powstaje z organizmów, ale jest składnikiem <b>nieożywionym</b>.</p>
 <h3><span class="hl-o">Poziomy glebowe</span> <small class="muted">(kliknij warstwę)</small></h3>
 <div class="dia-learn" id="learn-soil"></div><p class="say" id="soil-say" aria-live="polite">Kliknij warstwę na rysunku.</p>
 <ul>
  <li><b>Poziom próchniczny</b> – na górze; najwięcej składników ożywionych, wody i składników potrzebnych roślinom. <b>Im grubszy i ciemniejszy, tym lepiej</b> gleba nadaje się do uprawy.</li>
  <li><b>Głębsze poziomy glebowe</b> – różnią się barwą i składnikami. <b>Im głębiej, tym mniej składników ożywionych</b>, a więcej skały.</li>
  <li><b>Skała</b> – najgłębszy poziom, z którego powstała gleba (podłoże); może być lita, zwięzła lub luźna.</li>

 <ul>
  <li>podłoże dla roślin – także uprawnych (zboża, owoce, warzywa), czyli nasze <b>pożywienie</b>,</li>
  <li>miejsce życia zwierząt,</li>
  <li><b>zapobiega powodziom</b> – chłonie wodę jak gąbka, potem woda powoli odpływa do rzek i jezior,</li>

badania:`
 <h2>Gleba w mojej okolicy</h2>
 <p><b>Po co badamy glebę?</b> Żeby poznać jej cechy i sprawdzić, czy nadaje się do uprawy roślin.</p>
 <p><b>Potrzebne:</b> lupa, szpadel, łopatka ogrodnicza, taśma miernicza (lub centymetr krawiecki), karta obserwacji. Wykop ma <b>30–50 cm</b> głębokości – po badaniu <b>zasypujemy</b> go.</p>
 <h3><span class="hl-o">Pięć cech gleby, które badamy</span></h3>
 <ol>
  <li><b>Grubość poziomu próchnicznego</b> – mierzymy taśmą, w centymetrach.</li>
  <li><b>Barwa</b>:
   <ul><li>szara lub ciemnobrązowa → <b>próchnica</b>,</li><li>czerwonawa lub brązowa → <b>żelazo</b>,</li><li>jasnoszara lub jasnożółta → <b>dużo skał</b>, np. piasku lub wapienia.</li></ul></li>
  <li><b>Struktura</b> (jak gleba się układa):
   <ul><li><b>luźna</b> – nie tworzy bryłek, przesypuje się,</li><li><b>gruzełkowa</b> – małe bryłki, między nimi woda i powietrze – <b>najlepsza dla roślin</b>,</li><li><b>bryłowa</b> – duże, zwarte bryły, czasem większe niż dłoń.</li></ul></li>
  <li><b>Uziarnienie</b> (jakie ziarna skał przeważają): <b>piaszczysta</b>, <b>gliniasta</b>, <b>kamienista</b>. Przez piasek i kamienie woda szybko przecieka, glina ją zatrzymuje.</li>
  <li><b>Obecność organizmów</b> – szukamy zwierząt, korzeni, grzybni i śladów (kanaliki); małe organizmy, np. skoczogonki, oglądamy przez <b>lupę</b>.</li>
 </ol>
 <h3><span class="hl-c">Gleba dobra dla roślin</span></h3>
 <ul><li>zawiera <b>dużo próchnicy</b> (jest ciemna),</li><li>zawiera <b>wodę</b>,</li><li>ma <b>strukturę gruzełkową</b>,</li><li>żyje w niej <b>wiele organizmów</b>.</li></ul>
 <p><b>Ziemia ogrodnicza</b> ma dużo próchnicy i strukturę gruzełkową.</p>
 <h3><span class="hl-p">Doświadczenia</span></h3>
 <ul>
  <li><b>Ziemia ogrodnicza czy gleba z okolicy?</b> Dwie doniczki – inna jest <u>tylko gleba</u>. Ilość wody, liczba nasion i miejsce muszą być takie same.</li>
  <li><b>Woda w glebie</b> – rośliny pobierają większość wody z gleby <b>korzeniami</b>. Rzeżucha podlewana rośnie dobrze, niepodlewana – słabo.</li>
  <li><b>Filtr glebowy</b> – butelka, filtr do kawy, gleba i woda zabarwiona atramentem: woda po przejściu przez glebę jest czystsza – <b>gleba oczyszcza wodę</b>.</li>
 </ul>`,
zywe:`
 <h2>Rośliny i zwierzęta w mojej okolicy</h2>
 <h3><span class="hl-o">Rośliny w domu</span></h3>
 <p>Doniczkowe: <b>dracena, fikus, sępolia (fiołek), paprotka, storczyk, zielistka</b>.</p>
 <p>Korzyści: zdobią pomieszczenia, <b>produkują tlen</b>, <b>nawilżają powietrze</b> (paprotka nawet je <b>oczyszcza</b>), <b>mięta i bazylia</b> to przyprawy, a dbając o rośliny poznajemy przyrodę i uczymy się <b>systematyczności</b>.</p>
 <p>Przy szkołach rosną np. kasztanowce, brzozy, róże – rośliny przyciągają zwierzęta, które szukają <b>schronienia i pożywienia</b>.</p>
 <p><b>Tulipany</b> sadzimy jesienią – <b>przed końcem października</b>: cebulki na głębokość <b>15 cm</b>, co 15–20 cm, <b>spiczastą częścią do góry</b>, okrywamy rozdrobnioną korą.</p>
 <h3><span class="hl-c">Zwierzęta przy ludziach</span></h3>

function pickQs(topics,n){return shuffle(BANK.filter(q=>topics.includes(q.topic))).slice(0,n)}
function pickBalanced(topics,n){
  const pools=shuffle(topics).map(t=>shuffle(BANK.filter(q=>q.topic===t)));const out=[];let k=0;
  while(out.length<n&&pools.some(p=>p.length)){const p=pools[k%pools.length];if(p.length)out.push(p.pop());k++}
  return shuffle(out);
}

/* ================= QUIZ ================= */
function instantiate(src){
  let q;
  for(let tries=0;tries<8;tries++){q=src.t==='gen'?src.make():{...src};if(!instantiate.seen||!instantiate.seen.has(q.q))break}
  if(instantiate.seen)instantiate.seen.add(q.q);
  q.src=src;q.topic=src.topic;q.user=null;q.checked=false;q.score=0;
  if(q.t==='single')q.opts=shuffle(q.opts.map((x,i)=>({x,ok:i===0})));
  if(q.t==='tf')q.opts=[{x:'Prawda',ok:q.a===true},{x:'Fałsz',ok:q.a===false}];
  if(q.t==='multi'){q.opts=shuffle(q.ok.map(x=>({x,ok:true})).concat(q.no.map(x=>({x,ok:false}))));q.user=new Set()}
  if(q.t==='sort')q.user=q.items.map(()=>null);
  if(q.t==='order'){let c;do{c=shuffle(q.items.map((_,i)=>i))}while(c.every((v,i)=>v===i));q.user=c}
  return q;
}
function launch(srcs,opt){
  instantiate.seen=new Set();
  const qs=(opt.keepOrder?srcs:shuffle(srcs)).map(instantiate);instantiate.seen=null;
  S.quiz={qs,i:0,instant:opt.instant,day:opt.day,label:opt.label};go('quiz');
}
function answered(q){
  if(q.t==='multi')return q.user.size>0;
  if(q.t==='order')return true;
  if(q.t==='sort')return q.user.every(v=>v!==null);
  return q.user!==null;
}
function grade1(q){
  if(q.t==='single'||q.t==='tf'){q.score=q.opts[q.user].ok?1:0;q.userText=q.opts[q.user].x;q.correctText=q.opts.find(o=>o.ok).x}
  else if(q.t==='multi'){const total=q.opts.filter(o=>o.ok).length;let good=0,bad=0;q.user.forEach(i=>q.opts[i].ok?good++:bad++);
    q.score=(bad===0&&good===total)?1:(bad===0&&good>=total/2)?0.5:0;
    q.userText=[...q.user].map(i=>q.opts[i].x).join(', ');q.correctText=q.opts.filter(o=>o.ok).map(o=>o.x).join(', ')}
  else if(q.t==='order'){const right=q.user.filter((v,i)=>v===i).length;q.score=right===q.items.length?1:right>=3?0.5:0;
    q.userText=q.user.map((v,i)=>`${i+1}. ${q.items[v]}`).join('; ');q.correctText=q.items.map((x,i)=>`${i+1}. ${x}`).join('; ')}
  else if(q.t==='sort'){const right=q.items.filter((it,i)=>q.user[i]===it.c).length,n=q.items.length;q.score=right===n?1:right>=Math.ceil(n*0.7)?0.5:0;
    q.userText=q.items.map((it,i)=>`${it.x} → ${q.cats[q.user[i]]}`).join('; ');q.correctText=q.items.map(it=>`${it.x} → ${q.cats[it.c]}`).join('; ')}
  else if(q.t==='hot'){const Z=HOT[q.hot].Z;q.score=q.user===q.target?1:0;q.userText=Z[q.user].n;q.correctText=Z[q.target].n}
  q.checked=true;
}
const HINT={single:'Wybierz jedną odpowiedź.',tf:'Prawda czy fałsz?',multi:'Zaznacz wszystkie poprawne odpowiedzi.',order:'Przesuwaj strzałkami, aż kolejność będzie dobra.',sort:'Przy każdym elemencie wybierz właściwą grupę.',hot:'Kliknij właściwe miejsce na rysunku.'};
function renderQuiz(){
  const Z=S.quiz,q=Z.qs[Z.i],last=Z.i===Z.qs.length-1,locked=q.checked&&Z.instant;
  let area='';
  if(q.t==='single'||q.t==='tf'){
    area=`<div class="opts ${q.t==='tf'?'tf':''}">${q.opts.map((o,i)=>{let c='';if(locked){if(o.ok)c='ok';else if(q.user===i)c='no'}else if(q.user===i)c='sel';
      const mark=locked?(o.ok?'✓':(q.user===i?'✗':'')):(q.user===i?'●':'');
      return `<button class="opt round ${c}" data-i="${i}" ${locked?'disabled':''}><span class="box">${mark}</span>${esc(o.x)}</button>`}).join('')}</div>`;
  }else if(q.t==='multi'){
    area=`<div class="opts">${q.opts.map((o,i)=>{const on=q.user.has(i);let c='';if(locked){if(on)c=o.ok?'ok':'no';else if(o.ok)c='ok'}else if(on)c='sel';
      const mark=locked?(o.ok?'✓':(on?'✗':'')):(on?'✓':'');
      return `<button class="opt ${c}" data-i="${i}" aria-pressed="${on}" ${locked?'disabled':''}><span class="box">${mark}</span>${esc(o.x)}${locked&&o.ok&&!on?' <small>(pominięte)</small>':''}</button>`}).join('')}</div>`;
  }else if(q.t==='order'){
    area=`<ol class="order">${q.user.map((v,pos)=>{const c=locked?(v===pos?'ok':'no'):'';
      return `<li class="${c}"><span class="pos">${pos+1}</span><span class="txt">${esc(q.items[v])}</span>${locked?'':`<span class="mv"><button data-up="${pos}" aria-label="Przesuń wyżej" ${pos===0?'disabled':''}>▲</button><button data-down="${pos}" aria-label="Przesuń niżej" ${pos===q.user.length-1?'disabled':''}>▼</button></span>`}</li>`}).join('')}</ol>`;
  }else if(q.t==='sort'){
    area=`<ul class="sort">${q.items.map((it,i)=>{const rowc=locked?(q.user[i]===it.c?'ok':'no'):'';
      return `<li class="${rowc}"><span class="txt">${esc(it.x)}</span><span class="cats">${q.cats.map((c,ci)=>{let cc='';if(locked){if(ci===it.c)cc='ok';else if(q.user[i]===ci)cc='no'}else if(q.user[i]===ci)cc='sel';
        return `<button class="cat ${cc}" data-si="${i}" data-ci="${ci}" aria-pressed="${q.user[i]===ci}" ${locked?'disabled':''}>${esc(c)}</button>`}).join('')}</span></li>`}).join('')}</ul>`;
  }else if(q.t==='hot'){
    const st={};if(locked){st[q.target]='ok';if(q.user!==q.target)st[q.user]='no'}else if(q.user)st[q.user]='sel';
    area=`<div class="hot-q">${HOT[q.hot].svg({labels:locked,states:st})}</div>`;
  }
  let fb='';
  if(locked){const cls=q.score===1?'ok':q.score>0?'half':'no',head=q.score===1?'✓ Dobrze! +1 pkt':q.score>0?'½ Częściowo dobrze, +0,5 pkt':'✗ Niestety źle';
    fb=`<div class="feedback ${cls}" role="status"><b>${head}</b>${q.score<1?`Poprawnie: ${esc(q.correctText)}<br>`:''}${esc(q.why)}</div>`}
  const pct=((Z.i+(q.checked?1:0))/Z.qs.length)*100;
  const btnLabel=Z.instant&&!q.checked?'Sprawdź':(last?'Zakończ test':'Dalej');
  main.innerHTML=`<section class="panel">
    ${Z.label?`<p class="qlabel">${esc(Z.label)}${Z.instant?'':' · bez podpowiedzi'}</p>`:''}
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qmeta"><span>Pytanie ${Z.i+1} z ${Z.qs.length}</span><span>${topicName(q.topic)}</span></div>
    <p class="qtext">${esc(q.q)}</p><p class="qhint">${HINT[q.t]}</p>
    ${area}${fb}
    <div class="qactions"><button class="btn ghost" id="quit">Przerwij</button><button class="btn" id="next" ${answered(q)?'':'disabled'}>${btnLabel}</button></div>
  </section>`;
  if(!locked){
    main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(q.t==='multi'){q.user.has(i)?q.user.delete(i):q.user.add(i)}else q.user=i;renderQuiz();const f=main.querySelector(`.opt[data-i="${i}"]`);if(f)f.focus()});
    main.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const p=+b.dataset.up;[q.user[p-1],q.user[p]]=[q.user[p],q.user[p-1]];renderQuiz();const f=main.querySelector(`[data-up="${p-1}"]`)||main.querySelector(`[data-down="${p-1}"]`);if(f)f.focus()});
    main.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const p=+b.dataset.down;[q.user[p+1],q.user[p]]=[q.user[p],q.user[p+1]];renderQuiz();const f=main.querySelector(`[data-down="${p+1}"]`)||main.querySelector(`[data-up="${p+1}"]`);if(f)f.focus()});
    main.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{const i=+b.dataset.si,ci=+b.dataset.ci;q.user[i]=ci;renderQuiz();const f=main.querySelector(`.cat[data-si="${i}"][data-ci="${ci}"]`);if(f)f.focus()});
    const hq=main.querySelector('.hot-q');if(hq)bindHot(hq,k=>{q.user=k;renderQuiz();const g=main.querySelector(`.hz[data-k="${k}"]`);if(g)g.focus()});
  }
  document.getElementById('next').onclick=nextStep;
  document.getElementById('quit').onclick=()=>{if(confirm('Przerwać test? Wynik nie zostanie zapisany.')){S.quiz=null;go(Z.day!=null?'plan':'setup')}};
}
function nextStep(){
  const Z=S.quiz,q=Z.qs[Z.i];if(!answered(q))return;
  if(Z.instant&&!q.checked){grade1(q);renderQuiz();document.getElementById('next').focus();return}
  if(!q.checked)grade1(q);
  if(Z.i<Z.qs.length-1){Z.i++;renderQuiz();window.scrollTo({top:0})}else finish();
}
function finish(){
  const Z=S.quiz,pts=Z.qs.reduce((a,q)=>a+q.score,0),max=Z.qs.length,pct=pts/max*100,G=gradeFor(pct);
  Z.result={pts,max,pct,G};
  if(!Z.fix){
    const h=store('p5-history')||[];h.unshift({d:Date.now(),pts,max,pct,g:G.g,label:Z.label});store('p5-history',h.slice(0,30));
    if(Z.day!=null){const ps=planState();ps[Z.day]=G.g;store('p5-plan',ps)}
  }
  const st=getStats();Z.qs.forEach(q=>{const s=st[q.topic]||(st[q.topic]={ok:0,n:0});s.n++;s.ok+=q.score});store('p5-stats',st);
  go('results');
}

/* ================= WYNIKI ================= */
function renderResults(){
  const Z=S.quiz,{pts,max,pct,G}=Z.result,wrong=Z.qs.filter(q=>q.score<1);
  const per={};Z.qs.forEach(q=>{const p=per[q.topic]||(per[q.topic]={ok:0,n:0});p.n++;p.ok+=q.score});
  main.innerHTML=`<section class="panel">
    ${Z.label?`<p class="qlabel">${esc(Z.label)}${Z.fix?' · poprawa błędów (nie liczy się do oceny dnia)':''}</p>`:''}
    <div class="result-top">
      <div class="grade" aria-label="Ocena ${G.g}"><svg viewBox="0 0 150 150" aria-hidden="true"><path d="M78 14 C 30 10, 10 50, 16 88 C 22 128, 70 142, 108 128 C 142 114, 146 62, 124 34 C 108 14, 80 8, 56 18"/></svg><div class="digit">${G.g}</div></div>
      <div><p class="gname">${G.name}</p><p class="gsum"><b>${fmt(pts)}</b> z ${max} pkt, czyli ${Math.round(pct)}%</p><p class="gmsg">${G.msg}</p></div>
    </div>
    ${Object.keys(per).length>1?`<ul class="per">${Object.entries(per).map(([t,p])=>`<li><span>${topicName(t)}</span><span class="bar"><i style="width:${p.ok/p.n*100}%"></i></span><b>${fmt(p.ok)}/${p.n}</b></li>`).join('')}</ul>`:''}
    <div class="res-actions">
      ${wrong.length?`<button class="btn" id="fix">Popraw błędy (${wrong.length})</button>`:''}
      <button class="btn ${wrong.length?'ghost':''}" id="toplan">Wróć do planu</button>
      <button class="btn ghost" id="tolearn">Notatki</button>
    </div>
    <ol class="review">${Z.qs.map((q,i)=>{const cls=q.score===1?'ok':q.score>0?'half':'no',m=q.score===1?'✓':q.score>0?'½':'✗';
      return `<li><div><span class="mark ${cls}">${m}</span><b>${i+1}.</b> ${esc(q.q)}</div>
        ${q.score<1?`<p class="row">Twoja odpowiedź: ${esc(q.userText)}</p><p class="row">Poprawna: <b>${esc(q.correctText)}</b></p><p class="why">${esc(q.why)}</p>`:''}</li>`}).join('')}</ol>
  </section>`;
  const fx=document.getElementById('fix');
  if(fx)fx.onclick=()=>{instantiate.seen=null;S.quiz={qs:shuffle(wrong.map(q=>{const n=instantiate(q.src);return q.src.t==='gen'?fixClone(q):n})),i:0,instant:true,fix:true,label:(Z.label||'Test')};go('quiz')};
  document.getElementById('toplan').onclick=()=>{S.quiz=null;go('plan')};
  document.getElementById('tolearn').onclick=()=>{const t=wrong[0]?wrong[0].topic:S.topic;S.topic=t;S.quiz=null;go('learn')};
}
// przy poprawie błędów pytanie generowane wraca w tej samej postaci (z nowym przetasowaniem)
function fixClone(q){
  const c={...q,user:null,checked:false,score:0};
  if(c.t==='single')c.opts=shuffle(q.opts);
  if(c.t==='multi'){c.opts=shuffle(q.opts);c.user=new Set()}
  if(c.t==='sort'){c.items=shuffle(q.items);c.user=c.items.map(()=>null)}
  if(c.t==='order'){let o;do{o=shuffle(q.items.map((_,i)=>i))}while(o.every((v,i)=>v===i));c.user=o}
  return c;
}

render();
</script>
